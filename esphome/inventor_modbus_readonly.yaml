substitutions:
  name: inventor-matrix-modbus
  friendly_name: Inventor Matrix Modbus

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Read-only Modbus telemetry for Inventor HU060S3 / ATS04S"

esp8266:
  board: d1_mini

# Logs go over the Home Assistant API, not over the UART used for Modbus.
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret inventor_modbus_api_key

ota:
  - platform: esphome
    password: !secret inventor_modbus_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Inventor-Modbus-Fallback"
    password: !secret inventor_modbus_fallback_password

captive_portal:

# D1 mini: D1 / GPIO5 = TX, D2 / GPIO4 = RX.
# The adapter shown is automatic-direction RS485, so no DE/RE GPIO is configured.
uart:
  id: hp_uart
  tx_pin: GPIO5
  rx_pin: GPIO4
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: hp_modbus
  uart_id: hp_uart

modbus_controller:
  - id: heat_pump
    address: 0x01
    modbus_id: hp_modbus
    update_interval: 15s
    setup_priority: -10

sensor:
  - platform: modbus_controller
    modbus_controller_id: heat_pump
    name: "Außentemperatur Modbus"
    id: hp_outdoor_temperature
    register_type: holding
    address: 107
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: heat_pump
    name: "Warmwasserspeicher Modbus"
    id: hp_dhw_temperature
    register_type: holding
    address: 115
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: heat_pump
    name: "Wassereintritt Modbus"
    id: hp_water_inlet_temperature
    register_type: holding
    address: 104
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: heat_pump
    name: "Wasseraustritt Modbus"
    id: hp_water_outlet_temperature
    register_type: holding
    address: 105
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: heat_pump
    name: "Kompressorfrequenz Modbus"
    id: hp_compressor_frequency
    register_type: holding
    address: 100
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: heat_pump
    name: "Kompressor-Laufzeit Modbus"
    id: hp_compressor_runtime
    register_type: holding
    address: 122
    value_type: S_WORD
    unit_of_measurement: "h"
    state_class: total_increasing
    accuracy_decimals: 0
