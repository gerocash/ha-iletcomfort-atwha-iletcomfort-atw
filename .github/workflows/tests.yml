name: Tests

on:
  push:
  pull_request:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run protocol regression tests
        run: python -m pytest -q tests/test_atw_placeholder.py tests/test_mqtt_topic_variants.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Android MQTT probe syntax
        run: node --check tools/frida_mqtt_capture.js
      - name: Validate read-only Modbus YAML
        run: |
          python -m pip install pyyaml
          python -c "import yaml; d=yaml.safe_load(open('modbus/inventor_ats04s_readonly.yaml', encoding='utf-8')); hub=d['modbus'][0]; assert len(hub['sensors']) >= 20; assert not any(k in hub for k in ('switches','numbers','climates','selects','covers','fans','lights')); print(f\"validated {len(hub['sensors'])} read-only registers\")"
